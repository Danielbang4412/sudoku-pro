<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Sudoku – Easy</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 20px;
        text-align: center;
    }
    h1 { margin-bottom: 10px; }
    #timer, #best {
        font-size: 18px;
        margin: 5px;
    }
    table {
        margin: 20px auto;
        border-collapse: collapse;
    }
    td {
        width: 40px;
        height: 40px;
        border: 1px solid #555;
        text-align: center;
        font-size: 20px;
        background: white;
    }
    input {
        width: 38px;
        height: 38px;
        text-align: center;
        font-size: 20px;
        border: none;
    }
    .bold-border-top    { border-top: 3px solid black; }
    .bold-border-left   { border-left: 3px solid black; }
    .bold-border-right  { border-right: 3px solid black; }
    .bold-border-bottom { border-bottom: 3px solid black; }
    #win {
        font-size: 22px;
        color: green;
        margin-top: 20px;
        display: none;
    }
</style>
</head>

<body>

<h1>Sudoku – Easy</h1>
<div id="timer">Zeit: 0s</div>
<div id="best">Beste Zeit: –</div>

<table id="grid"></table>

<div id="win">✔ Sudoku gelöst!</div>

<script>
// ---------------------------
// TIMER
// ---------------------------
let seconds = 0;
let timerInterval = setInterval(() => {
    seconds++;
    document.getElementById("timer").innerText = "Zeit: " + seconds + "s";
}, 1000);

// Beste Zeit laden
if (localStorage.getItem("best_easy")) {
    document.getElementById("best").innerText =
        "Beste Zeit: " + localStorage.getItem("best_easy") + "s";
}

// ---------------------------
// SUDOKU GENERATOR (einfach)
// ---------------------------
function generateSudoku() {
    // Basis-Sudoku (korrekt)
    let base = [
        [1,2,3,4,5,6,7,8,9],
        [4,5,6,7,8,9,1,2,3],
        [7,8,9,1,2,3,4,5,6],
        [2,3,4,5,6,7,8,9,1],
        [5,6,7,8,9,1,2,3,4],
        [8,9,1,2,3,4,5,6,7],
        [3,4,5,6,7,8,9,1,2],
        [6,7,8,9,1,2,3,4,5],
        [9,1,2,3,4,5,6,7,8]
    ];

    // Zufällige Zeilen/Spalten/Blöcke tauschen
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            let j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
    }

    // Reihenfolge der 3er-Blöcke mischen
    let blockOrder = [0,1,2];
    shuffle(blockOrder);

    let newGrid = [];
    for (let b of blockOrder) {
        let rows = [0,1,2];
        shuffle(rows);
        for (let r of rows) {
            newGrid.push(base[b*3 + r].slice());
        }
    }

    // Spaltenblöcke mischen
    let colBlockOrder = [0,1,2];
    shuffle(colBlockOrder);

    let finalGrid = newGrid.map(row => {
        let newRow = [];
        for (let b of colBlockOrder) {
            let cols = [0,1,2];
            shuffle(cols);
            for (let c of cols) {
                newRow.push(row[b*3 + c]);
            }
        }
        return newRow;
    });

    return finalGrid;
}

// ---------------------------
// EASY: Felder entfernen
// ---------------------------
function makeEasy(grid) {
    let holes = 40; // Easy-Level
    while (holes > 0) {
        let r = Math.floor(Math.random() * 9);
        let c = Math.floor(Math.random() * 9);
        if (grid[r][c] !== 0) {
            grid[r][c] = 0;
            holes--;
        }
    }
    return grid;
}

// ---------------------------
// RENDER
// ---------------------------
let solution = generateSudoku();
let puzzle = JSON.parse(JSON.stringify(solution));
puzzle = makeEasy(puzzle);

let table = document.getElementById("grid");

for (let r = 0; r < 9; r++) {
    let row = document.createElement("tr");
    for (let c = 0; c < 9; c++) {
        let cell = document.createElement("td");

        // Fette Blocklinien
        if (r % 3 === 0) cell.classList.add("bold-border-top");
        if (c % 3 === 0) cell.classList.add("bold-border-left");
        if (r === 8) cell.classList.add("bold-border-bottom");
        if (c === 8) cell.classList.add("bold-border-right");

        if (puzzle[r][c] === 0) {
            let inp = document.createElement("input");
            inp.maxLength = 1;
            inp.oninput = checkWin;
            cell.appendChild(inp);
        } else {
            cell.innerText = puzzle[r][c];
        }

        row.appendChild(cell);
    }
    table.appendChild(row);
}

// ---------------------------
// CHECK WIN
// ---------------------------
function checkWin() {
    let inputs = document.querySelectorAll("input");
    for (let inp of inputs) {
        if (inp.value === "") return;
    }

    // Prüfen
    let idx = 0;
    for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
            if (puzzle[r][c] === 0) {
                let val = parseInt(inputs[idx].value);
                if (val !== solution[r][c]) return;
                idx++;
            }
        }
    }

    // Gewonnen
    clearInterval(timerInterval);
    document.getElementById("win").style.display = "block";

    // Beste Zeit speichern
    let best = localStorage.getItem("best_easy");
    if (!best || seconds < best) {
        localStorage.setItem("best_easy", seconds);
        document.getElementById("best").innerText = "Beste Zeit: " + seconds + "s";
    }
}
</script>

</body>
</html>
