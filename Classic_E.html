<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku - Einfach</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .difficulty {
            text-align: center;
            color: #28a745;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .sudoku-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 0;
            width: 100%;
            max-width: 450px;
            margin: 0 auto 20px;
            border: 3px solid #333;
            background: #333;
        }

        .cell {
            aspect-ratio: 1;
            border: 1px solid #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cell input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            background: transparent;
            outline: none;
            color: #667eea;
        }

        .cell.fixed {
            background: #f0f0f0;
            color: #333;
        }

        .cell.fixed input {
            color: #333;
            cursor: default;
        }

        .cell:hover:not(.fixed) {
            background: #e8eaf6;
        }

        .cell.selected {
            background: #c5cae9 !important;
        }

        .cell.error {
            background: #ffcdd2 !important;
        }

        .cell.success {
            background: #c8e6c9 !important;
        }

        /* Dickere Rahmen für 3x3 Blöcke */
        .cell:nth-child(3n) {
            border-right: 3px solid #333;
        }

        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 3px solid #333;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 12px 24px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .btn-check {
            background: #667eea;
        }

        .btn-check:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-hint {
            background: #ffa726;
        }

        .btn-hint:hover {
            background: #fb8c00;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 167, 38, 0.4);
        }

        .btn-reset {
            background: #ef5350;
        }

        .btn-reset:hover {
            background: #e53935;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 83, 80, 0.4);
        }

        .btn-new {
            background: #26a69a;
        }

        .btn-new:hover {
            background: #00897b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(38, 166, 154, 0.4);
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 30px;
            color: #667eea;
        }

        .timer {
            text-align: center;
            font-size: 1.5em;
            color: #555;
            margin-bottom: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }

            .cell input {
                font-size: 1.2em;
            }

            button {
                padding: 10px 16px;
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Sudoku</h1>
        <div class="difficulty">⭐ Einfach</div>
        <div class="timer" id="timer">00:00</div>
        
        <div class="sudoku-grid" id="grid"></div>
        
        <div class="controls">
            <button class="btn-check" onclick="checkSolution()">✓ Prüfen</button>
            <button class="btn-hint" onclick="giveHint()">💡 Hinweis</button>
            <button class="btn-reset" onclick="resetGame()">↺ Zurücksetzen</button>
            <button class="btn-new" onclick="newGame()">🎲 Neues Spiel</button>
        </div>
        
        <div class="message" id="message"></div>
    </div>

    <script>
        // Einfaches Sudoku-Puzzle (ca. 45 vorgegebene Zahlen)
        const initialPuzzle = [
            [5, 3, 0, 0, 7, 0, 0, 0, 0],
            [6, 0, 0, 1, 9, 5, 0, 0, 0],
            [0, 9, 8, 0, 0, 0, 0, 6, 0],
            [8, 0, 0, 0, 6, 0, 0, 0, 3],
            [4, 0, 0, 8, 0, 3, 0, 0, 1],
            [7, 0, 0, 0, 2, 0, 0, 0, 6],
            [0, 6, 0, 0, 0, 0, 2, 8, 0],
            [0, 0, 0, 4, 1, 9, 0, 0, 5],
            [0, 0, 0, 0, 8, 0, 0, 7, 9]
        ];

        const solution = [
            [5, 3, 4, 6, 7, 8, 9, 1, 2],
            [6, 7, 2, 1, 9, 5, 3, 4, 8],
            [1, 9, 8, 3, 4, 2, 5, 6, 7],
            [8, 5, 9, 7, 6, 1, 4, 2, 3],
            [4, 2, 6, 8, 5, 3, 7, 9, 1],
            [7, 1, 3, 9, 2, 4, 8, 5, 6],
            [9, 6, 1, 5, 3, 7, 2, 8, 4],
            [2, 8, 7, 4, 1, 9, 6, 3, 5],
            [3, 4, 5, 2, 8, 6, 1, 7, 9]
        ];

        let currentPuzzle = JSON.parse(JSON.stringify(initialPuzzle));
        let selectedCell = null;
        let startTime = Date.now();
        let timerInterval;

        function initGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = i;
                    cell.dataset.col = j;

                    const input = document.createElement('input');
                    input.type = 'text';
                    input.maxLength = 1;
                    input.pattern = '[1-9]';

                    if (initialPuzzle[i][j] !== 0) {
                        input.value = initialPuzzle[i][j];
                        input.disabled = true;
                        cell.classList.add('fixed');
                    } else {
                        input.value = currentPuzzle[i][j] !== 0 ? currentPuzzle[i][j] : '';
                    }

                    input.addEventListener('input', function(e) {
                        const value = e.target.value;
                        if (value === '' || /[1-9]/.test(value)) {
                            currentPuzzle[i][j] = value === '' ? 0 : parseInt(value);
                            if (value !== '') {
                                validateCell(i, j);
                            } else {
                                cell.classList.remove('error', 'success');
                            }
                        } else {
                            e.target.value = '';
                        }
                    });

                    input.addEventListener('focus', function() {
                        if (selectedCell) {
                            selectedCell.classList.remove('selected');
                        }
                        cell.classList.add('selected');
                        selectedCell = cell;
                    });

                    cell.appendChild(input);
                    grid.appendChild(cell);
                }
            }

            startTimer();
        }

        function validateCell(row, col) {
            const cells = document.querySelectorAll('.cell');
            const index = row * 9 + col;
            const cell = cells[index];
            const value = currentPuzzle[row][col];

            if (value === 0) {
                cell.classList.remove('error', 'success');
                return;
            }

            if (value === solution[row][col]) {
                cell.classList.remove('error');
                cell.classList.add('success');
            } else {
                cell.classList.remove('success');
                cell.classList.add('error');
            }
        }

        function checkSolution() {
            let correct = 0;
            let total = 0;
            let allFilled = true;

            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (initialPuzzle[i][j] === 0) {
                        total++;
                        if (currentPuzzle[i][j] === 0) {
                            allFilled = false;
                        } else if (currentPuzzle[i][j] === solution[i][j]) {
                            correct++;
                        }
                    }
                }
            }

            const message = document.getElementById('message');
            
            if (allFilled && correct === total) {
                message.textContent = '🎉 Perfekt! Du hast das Sudoku gelöst!';
                message.style.color = '#28a745';
                clearInterval(timerInterval);
            } else if (allFilled) {
                message.textContent = `❌ ${total - correct} Fehler gefunden. Versuche es nochmal!`;
                message.style.color = '#dc3545';
            } else {
                message.textContent = `✓ ${correct} von ${total} richtig! Weiter so!`;
                message.style.color = '#667eea';
            }

            setTimeout(() => {
                message.textContent = '';
            }, 3000);
        }

        function giveHint() {
            const emptyCells = [];
            
            for (let i = 0; i < 9; i++) {
                for (let j = 0; j < 9; j++) {
                    if (initialPuzzle[i][j] === 0 && currentPuzzle[i][j] === 0) {
                        emptyCells.push({row: i, col: j});
                    }
                }
            }

            if (emptyCells.length === 0) {
                showMessage('💡 Keine leeren Zellen mehr!', '#ffa726');
                return;
            }

            const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            const cells = document.querySelectorAll('.cell');
            const index = randomCell.row * 9 + randomCell.col;
            const input = cells[index].querySelector('input');
            
            input.value = solution[randomCell.row][randomCell.col];
            currentPuzzle[randomCell.row][randomCell.col] = solution[randomCell.row][randomCell.col];
            validateCell(randomCell.row, randomCell.col);

            showMessage('💡 Hinweis gegeben!', '#ffa726');
        }

        function resetGame() {
            currentPuzzle = JSON.parse(JSON.stringify(initialPuzzle));
            const cells = document.querySelectorAll('.cell');
            
            cells.forEach((cell, index) => {
                const input = cell.querySelector('input');
                const row = Math.floor(index / 9);
                const col = index % 9;
                
                if (initialPuzzle[row][col] === 0) {
                    input.value = '';
                    cell.classList.remove('error', 'success');
                }
            });

            startTime = Date.now();
            showMessage('↺ Spiel zurückgesetzt!', '#ef5350');
        }

        function newGame() {
            // Einfaches neues Puzzle
            const puzzles = [
                {
                    puzzle: [
                        [0, 0, 3, 0, 2, 0, 6, 0, 0],
                        [9, 0, 0, 3, 0, 5, 0, 0, 1],
                        [0, 0, 1, 8, 0, 6, 4, 0, 0],
                        [0, 0, 8, 1, 0, 2, 9, 0, 0],
                        [7, 0, 0, 0, 0, 0, 0, 0, 8],
                        [0, 0, 6, 7, 0, 8, 2, 0, 0],
                        [0, 0, 2, 6, 0, 9, 5, 0, 0],
                        [8, 0, 0, 2, 0, 3, 0, 0, 9],
                        [0, 0, 5, 0, 1, 0, 3, 0, 0]
                    ],
                    solution: [
                        [4, 8, 3, 9, 2, 1, 6, 5, 7],
                        [9, 6, 7, 3, 4, 5, 8, 2, 1],
                        [2, 5, 1, 8, 7, 6, 4, 9, 3],
                        [5, 4, 8, 1, 3, 2, 9, 7, 6],
                        [7, 2, 9, 5, 6, 4, 1, 3, 8],
                        [3, 1, 6, 7, 9, 8, 2, 4, 5],
                        [1, 3, 2, 6, 8, 9, 5, 8, 4],
                        [8, 7, 4, 2, 5, 3, 7, 1, 9],
                        [6, 9, 5, 4, 1, 7, 3, 8, 2]
                    ]
                }
            ];

            const newPuzzle = puzzles[0];
            Object.assign(initialPuzzle, newPuzzle.puzzle.map(row => [...row]));
            Object.assign(solution, newPuzzle.solution.map(row => [...row]));
            currentPuzzle = JSON.parse(JSON.stringify(initialPuzzle));
            
            initGrid();
            showMessage('🎲 Neues Spiel gestartet!', '#26a69a');
        }

        function showMessage(text, color) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.style.color = color;
            
            setTimeout(() => {
                message.textContent = '';
            }, 2000);
        }

        function startTimer() {
            clearInterval(timerInterval);
            startTime = Date.now();
            
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            }, 1000);
        }

        // Initialisierung
        initGrid();
    </script>
</body>
</html>
